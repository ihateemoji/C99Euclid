name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  linux:
    name: Linux (Ubuntu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        theme: [default, amber-crt, nord, vintage-green, gruvbox-dark, dracula]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libx11-dev
      - name: Apply theme
        if: matrix.theme != 'default'
        run: |
          patch -p0 < themes/${{ matrix.theme }}.patch
      - name: Build
        run: make
      - name: Test
        if: matrix.theme == 'default'
        run: make test

  freebsd:
    name: FreeBSD
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        theme: [default, amber-crt, nord, vintage-green, gruvbox-dark, dracula]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y gmake libX11
          run: |
            if [ "${{ matrix.theme }}" != "default" ]; then
              patch -p0 < themes/${{ matrix.theme }}.patch
            fi
            gmake
            if [ "${{ matrix.theme }}" = "default" ]; then
              gmake test
            fi
